[project]
name = "marketdata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.1",
    "beautifulsoup4>=4.14.3",
    "dynaconf>=3.2.12",
    "hishel>=1.1.7",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.44",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketdata"]

[tool.setuptools]
package-dir = { "" = "src" }
